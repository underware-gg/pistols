# ---------------------------------------------------------------------------
# Underware dependency policy. See docs/dependency-reviews/README.md.
# This file is the policy source of truth; changes here are reviewed changes.
# ---------------------------------------------------------------------------

# Fixed pins / explicit-update review.
savePrefix: ""
saveExact: true

packages:
  - "sdk"
  - "client"
  # - "dreams"
  - "verifier"
allowBuilds:
  "@parcel/watcher": false
  "@reown/appkit": false
  "@swc/core": false
  cbor-extract: false
  es5-ext: false
  esbuild: false
  # Optional native accelerator for msgpackr (via @effect/platform); msgpackr
  # falls back to pure JS. Node-only, never reaches the browser bundle.
  msgpackr-extract: false
  protobufjs: false

# Dependency-graph coherence. No package enters the tree undeclared.
autoInstallPeers: false
blockExoticSubdeps: true

catalog:
  #--------------------------------
  # Runtime catalog
  #
  "@apollo/client": 4.2.12

  #--------------------------------
  # misc
  #
  "@cartridge/connector": 0.14.0
  "@cartridge/controller": 0.14.0
  "@cartridge/presets": 0.5.4

  # daydreams
  "@daydreamsai/core": ^0.0.4
  "@dojoengine/core": 2.0.0
  "@dojoengine/sdk": 2.0.0
  "@dojoengine/torii-client": 1.8.2
  "@dojoengine/utils": 2.0.0
  # Required (non-optional) peers of @effect/opentelemetry, which @dojoengine/grpc
  # depends on from 1.8.6. Its other seven OpenTelemetry peers are optional and,
  # with autoInstallPeers off, are not installed. Retires with @dojoengine/grpc.
  "@effect/platform": 0.93.8
  "@opentelemetry/semantic-conventions": 1.43.0
  "@starknet-io/get-starknet-core": 5.0.0
  "@starknet-io/get-starknet-modal": 5.0.0
  "@starknet-io/get-starknet-wallet-standard": 5.0.0
  "@starknet-start/chains": 1.0.7
  "@starknet-start/explorers": 1.0.7
  "@starknet-start/providers": 1.0.7
  "@starknet-start/query": 1.0.7
  # "@dojoengine/core": ../../dojo4js/packages/core
  # "@dojoengine/sdk": ../../dojo.js/packages/sdk
  # "@dojoengine/torii-client": ../../dojo.js/packages/torii-client
  # "@dojoengine/utils": ../../dojo.js/packages/utils

  #--------------------------------
  # same as dojo.js
  # https://github.com/dojoengine/dojo.js/blob/main/pnpm-workspace.yaml
  #
  "@starknet-start/react": 1.0.8
  "@tanstack/react-query": 5.101.4
  "@types/node": 22.20.1
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.4
  immer: 11.1.18
  react: 19.2.8
  react-dom: 19.2.8
  starknet: 10.0.2
  tsup: 8.5.0
  typescript: 5.9.3
  universal-cookie: 8.1.2
  zustand: 5.0.15
  # "@daydreamsai/core": ../../daydreams/packages/core

  # Published peer contract for @underware/pistols-sdk, kept deliberately separate
  # from the catalog above.
  #
  # The catalog above is OUR resolution: exact, because we are the ones resolving,
  # and an unreviewed version must not be able to enter this tree. These are RANGES
  # because a peer dependency is never installed - it declares what a CONSUMER must
  # supply, and the consumer resolves and pins their own tree. Forcing an exact peer
  # adds no review; it removes their freedom to land on a version they have
  # reviewed, and in a conflict pushes them into duplicate copies of react or
  # starknet, which is a correctness and security problem we would be exporting.
  #
  # pnpm rewrites `catalog:peers` to the literal range on publish, the same way it
  # rewrites `catalog:` to the literal version, so this stays a single source of
  # truth per package. Verified with pnpm pack.
  #
  # Every range here MUST include the version pinned in the catalog above, or we
  # publish a contract that excludes what we actually build and test against.
  # scripts/check-catalog-drift.mjs enforces that; pnpm does not.
  #
  # Ranges are chosen per package, not uniformly. The Dojo 2 and Cartridge 0.14
  # carets stop at their next breaking boundary. Starknet is exact because
  # @dojoengine/sdk 2.0.0 requires 10.0.2 exactly; publishing a wider promise than
  # the dependency stack itself supports would make the SDK contract misleading.
catalogs:
  peers:
    "@apollo/client": "^3.11.8 || ^4.0.0"
    "@cartridge/connector": "^0.14.0"
    "@cartridge/controller": "^0.14.0"
    "@cartridge/presets": "^0.5.4"
    "@dojoengine/core": "^2.0.0"
    "@dojoengine/sdk": "^2.0.0"
    "@dojoengine/torii-client": "^1.8.2"
    "@dojoengine/utils": "^2.0.0"
    "@starknet-io/get-starknet-core": "^5.0.0"
    "@starknet-io/get-starknet-modal": "^5.0.0"
    "@starknet-io/get-starknet-wallet-standard": "^5.0.0"
    "@starknet-start/chains": "^1.0.7"
    "@starknet-start/explorers": "^1.0.7"
    "@starknet-start/providers": "^1.0.7"
    "@starknet-start/query": "^1.0.7"
    "@starknet-start/react": "^1.0.8"
    "@tanstack/react-query": "^5.62.16"
    immer: "^10.1.1 || ^11.0.0"
    react: "^19.0.0"
    starknet: "10.0.2"
    universal-cookie: "^8.0.1"
    zustand: "^4.5.6 || ^5.0.0"
dangerouslyAllowAllBuilds: false

# Runtime consistency.
engineStrict: true

# Supply-chain gates.
minimumReleaseAge: 10080 # 7 days, in minutes
# pnpm's default (true) SKIPS the age gate for any package whose registry
# metadata has no `time` field. That is the hole; false closes it.
minimumReleaseAgeIgnoreMissingTime: false
# Fail rather than fall back when no version in range clears the age gate.
# Defaults to true only because minimumReleaseAge is set explicitly; stated here
# so the guarantee does not depend on that coupling.
minimumReleaseAgeStrict: true

overrides:

  # Keep the wallet/provider boundary on the exact Starknet runtime required by
  # Dojo SDK 2. Both upstream ranges otherwise resolve independently.

  # Advisory remediation, 2026-08-23. Unscoped only where the package sits at a
  # single major line and every depender's range still accepts the target.
  "@babel/core": 7.29.6
  "@cartridge/controller>starknet": 10.0.2
  "@grpc/grpc-js": 1.14.4
  "@starknet-start/providers>starknet": 10.0.2
  "@walletconnect/jsonrpc-ws-connection>ws": 7.5.11
  ajv: 6.14.0
  "anymatch>picomatch": 2.3.2
  "copyfiles>glob": 7.2.3
  "copyfiles>minimatch": 3.1.4
  "cosmiconfig>yaml": 1.10.3
  defu: 6.1.5
  effect: 3.20.0
  "elliptic>bn.js": 4.12.3
  "ethers>ws": 8.21.0
  "external-editor>tmp": 0.2.7
  "fdir>picomatch": 4.0.4
  flatted: 3.4.2
  follow-redirects: 1.16.0
  form-data: 4.0.6
  "glob@10.5.0>minimatch": 9.0.7
  "glob@7.2.3>minimatch": 3.1.4
  h3: 1.15.9
  immutable: 5.1.8
  "isows>ws": 8.21.0
  js-yaml: 4.3.1
  lodash: 4.18.0
  lodash-es: 4.18.0
  "micromatch>picomatch": 2.3.2
  "minimatch@10.2.6>brace-expansion": 5.0.9
  "minimatch@3.1.4>brace-expansion": 1.1.18
  "minimatch@9.0.7>brace-expansion": 5.0.9
  nanoid: 3.3.18
  postcss: 8.5.23

  # protobufjs <= 7.5.4 allows arbitrary code execution (critical). Reached via
  # @grpc/proto-loader -> @grpc/grpc-js -> @dojoengine/sdk. We import only the
  # react and sql subpaths, so this is very likely not in the browser bundle,
  # but it is a critical with a patch available in range.
  protobufjs: 7.6.5
  rollup: 4.59.0
  "starknet>bn.js": 5.2.3

  # Parent-scoped, so each consumer stays inside the range it declares. Two of
  # these deliberately cross a major and are called out in the review record:
  # external-editor>tmp and vite-plugin-top-level-await>uuid.
  "starkscan>axios": 0.33.0
  "sucrase>glob": 10.5.0
  "tinyglobby>picomatch": 4.0.4
  "universal-cookie@6.1.3>cookie": 0.7.0
  validator: 13.15.22
  "viem>ws": 8.21.0
  "vite-plugin-mkcert>axios": 1.18.0
  "vite-plugin-top-level-await>uuid": 11.1.1
  "vite>picomatch": 4.0.4
  "vitest>picomatch": 4.0.4
patchedDependencies:
  semantic-ui-react@3.0.0-beta.2: patches/semantic-ui-react@3.0.0-beta.2.patch

peerDependencyRules:
  allowedVersions:
    # Dojo SDK 2 requires starknet 10.0.2, while Starknet Start query 1.0.7
    # still advertises its pre-10 peer. Its published runtime imports use the
    # stable provider/query surface; keep this exception exact and prove it
    # through typechecking and wallet/provider interaction tests.
    "@fluentui/react-component-event-listener>react": "19.2.8"
    "@fluentui/react-component-event-listener>react-dom": "19.2.8"
    "@semantic-ui-react/event-stack>react": "19.2.8"
    "@semantic-ui-react/event-stack>react-dom": "19.2.8"
    "@starknet-start/query>starknet": "10.0.2"
    "react-popper>react": "19.2.8"
    "react-popper>react-dom": "19.2.8"
    # Retained Semantic UI packages have abandoned React-18-only peer ranges.
    # These package-scoped exceptions are covered by React 19 interaction tests.
    "semantic-ui-react>react": "19.2.8"
    "semantic-ui-react>react-dom": "19.2.8"

# Install-script review. No package runs a lifecycle script without a
# recorded decision. See the supply-chain policy review record.
strictDepBuilds: true
strictPeerDependencies: true
verifyDepsBeforeRun: error
